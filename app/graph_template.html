<title>Neo-Roots Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<style>
/* Layout: one-screen tool — a sidebar (search, card, legend) beside the graph; roots at the left, words to the right. */
:root {
  --bg: #eef1f4;
  --panel: #fbfcfd;
  --ink: #18212c;
  --muted: #5a6676;
  --line: #d3d9e1;
  --accent: #2c5a86;
  --focus: #18212c;

  --n-root: #a8780a;
  --n-root-soft: #a8780a66;
  --n-nq: #13738a;
  --n-ns: #3a8343;
  --n-np: #6a55b0;
  --n-form: #8893a2;

  --e-deriv: #3b679c;
  --e-element: #b9503f;
  --e-combine: #74852f;
  --e-see: #8893a2;
  --e-deprecated: #b98320;
  --e-cognate: #a8458a;
  --e-cognates: #8a5fb0;
  --e-merged: #a8780a;
  --e-filed: #a8780a;
  --e-rootderiv: #a8780a;
  --e-instead: #9a7f5a;
  --l-elvish: #b0612a;

  --warn: #a5541d;
  --ok: #2f7a45;

  --f-form: "Noto Serif", "DejaVu Serif", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --panel: #171e27; --ink: #e3e8ef; --muted: #96a2b2; --line: #2a3441; --accent: #8db8e4; --focus: #f1f4f8;
    --n-root: #e2b34a; --n-root-soft: #e2b34a66; --n-nq: #49b6cc; --n-ns: #6dc07a; --n-np: #a593ea; --n-form: #7f8b9b;
    --e-deriv: #7ba7dc; --e-element: #e88371; --e-combine: #aabd5c; --e-see: #7f8b9b; --e-deprecated: #e2ad4c;
    --e-cognate: #dc7fc0; --e-cognates: #b796e0; --e-merged: #e2b34a; --e-filed: #e2b34a; --e-rootderiv: #e2b34a; --e-instead: #b9a17c; --l-elvish: #e39a5f;
    --warn: #ea9157; --ok: #6dc07a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --panel: #171e27; --ink: #e3e8ef; --muted: #96a2b2; --line: #2a3441; --accent: #8db8e4; --focus: #f1f4f8;
  --n-root: #e2b34a; --n-root-soft: #e2b34a66; --n-nq: #49b6cc; --n-ns: #6dc07a; --n-np: #a593ea; --n-form: #7f8b9b;
  --e-deriv: #7ba7dc; --e-element: #e88371; --e-combine: #aabd5c; --e-see: #7f8b9b; --e-deprecated: #e2ad4c;
  --e-cognate: #dc7fc0; --e-cognates: #b796e0; --e-merged: #e2b34a; --e-filed: #e2b34a; --e-rootderiv: #e2b34a; --e-instead: #b9a17c; --l-elvish: #e39a5f;
  --warn: #ea9157; --ok: #6dc07a;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(300px, 360px) 1fr;
}
.side {
  min-width: 0;
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.btn.lang { flex: none; font-size: 12px; padding: 3px 8px; }
.head-tools { display: flex; gap: 4px; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-form); font-weight: 600; font-size: 20px; letter-spacing: .01em; text-wrap: balance; }
.brand .stat { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.search { display: flex; flex-direction: column; gap: 6px; position: relative; }
.search-row { display: flex; gap: 6px; }
input[type="search"], select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0;
}
input[type="search"] { flex: 1; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.results {
  display: flex; flex-direction: column;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  max-height: 46vh; overflow-y: auto;
}
.results button {
  all: unset; cursor: pointer; display: block; padding: 6px 9px;
  border-bottom: 1px solid var(--line);
}
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--bg); }
.results .none { padding: 8px 9px; color: var(--muted); }

.mk { color: var(--muted); font-family: var(--f-form); font-size: .92em; }
.fm { font-family: var(--f-form); font-style: italic; font-weight: 500; }
.root-fm { font-style: normal; font-weight: 600; }
.gl { color: var(--muted); }

.card { display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; flex-direction: column; gap: 2px; }
.card-head .big { font-family: var(--f-form); font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta { color: var(--muted); font-size: 12.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.ok { color: var(--ok); border-color: currentColor; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  font: inherit; font-size: 12.5px; cursor: pointer;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
a.ext { color: var(--accent); font-size: 12.5px; }
.sec h3 {
  margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.links li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.links .rel { font-size: 11.5px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
.links button { all: unset; cursor: pointer; }
.links button:hover .fm, .links button:focus-visible .fm { text-decoration: underline; }
.written { flex-basis: 100%; padding-left: 12px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.more { color: var(--muted); font-size: 12px; }

.legend { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.legend label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.legend svg { flex: none; overflow: visible; }
.hint { color: var(--muted); font-size: 12px; }

.stage { position: relative; min-width: 0; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph:active { cursor: grabbing; }
/* both views are drawn on canvases over the svg, which takes the pointer (zoom, pan, picking) */
#gr-canvas, #ov-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#graph.hover { cursor: pointer; }
.ov-tip {
  position: absolute; z-index: 5; max-width: 320px; padding: 6px 9px; border-radius: 6px; pointer-events: none;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 8px rgb(0 0 0 / .12);
  font-size: 12.5px; white-space: pre-line;
}
.stage-bar {
  position: absolute; top: 12px; left: 12px; right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.stage-bar > * { pointer-events: auto; }
.stage-tools { display: flex; gap: 6px; }
.seg { display: flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 6px 0 0 6px; }
.seg .btn:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.seg .btn[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.stage-left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.ov-tools {
  width: 250px; max-width: 100%;
  display: flex; flex-direction: column; gap: 5px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-size: 12.5px;
}
.ov-tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.ov-head { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.ov-cat > circle { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.ov-cat > text { fill: var(--muted); font-family: var(--f-ui); font-weight: 600; text-anchor: middle; }
.ov-hint { margin: 2px 0 0; color: var(--muted); font-size: 11.5px; }
.ov-group circle { fill: var(--line); fill-opacity: .25; stroke: var(--line); }
.ov-group text { fill: var(--muted); font-family: var(--f-form); font-weight: 600; opacity: .55; }
.ov-leaf { cursor: pointer; }
.ov-leaf text { font-family: var(--f-form); font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.ov-leaf.sel circle { stroke: var(--focus); stroke-width: 2.2; }
.stage-note {
  position: absolute; left: 12px; bottom: max(10px, env(safe-area-inset-bottom, 0px));
  color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
}

.export { position: relative; }
/* the path between two words */
.pathbox { margin: 10px 0 4px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 8px; background: var(--panel); }
.pathbox > summary { cursor: pointer; font-weight: 600; font-size: 13px; padding: 2px 0; }
.pathbox[open] > summary { margin-bottom: 8px; }
.path-ends { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px; align-items: center; }
.path-ends .path-end:first-child { grid-column: 1; grid-row: 1; }
.path-ends #path-swap { grid-column: 2; grid-row: 1 / span 2; }
.path-ends .path-end:last-child { grid-column: 1; grid-row: 2; }
.path-end { position: relative; display: flex; flex-direction: column; }
.path-end input { width: 100%; box-sizing: border-box; }
.path-end .results { position: absolute; top: 100%; left: 0; right: 0; z-index: 4; max-height: 40vh; }
.pathbox .par-mode { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; font-size: 12.5px; }
.path-tools { display: flex; gap: 6px; margin-top: 8px; }
.path-one { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.path-one.alt { opacity: .85; }
.path-one.on { opacity: 1; }
.path-head { font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.path-sum { font-size: 12.5px; margin: 2px 0 4px; }
.path-lead { font-size: 12.5px; margin-bottom: 4px; }
.path-lead button { all: unset; cursor: pointer; }
.path-lead button:hover .fm { text-decoration: underline; }
.path-steps .arr { color: var(--muted); font-family: var(--f-ui); }
.path-base { font-family: var(--f-ui); }
.path-base button { font-size: 13px; }
.tag.cross { border-color: var(--warn); color: var(--warn); }
.export-menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; display: flex; flex-direction: column; gap: 2px;
  min-width: 190px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 2px 8px rgb(0 0 0 / .12);
}
.export-menu button { all: unset; padding: 5px 8px; border-radius: 4px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
.export-menu button:hover, .export-menu button:focus-visible { background: var(--bg); }
.edge-card .arrow { color: var(--muted); margin: 0 4px; }
.links button.dep, .links button.oth, .links button.nam { opacity: .7; }
.switches label { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; cursor: pointer; margin-bottom: 4px; }
.switches input { margin-top: 3px; }
.switches .par-mode { flex-direction: column; align-items: stretch; gap: 4px; cursor: default; }
.langs { display: flex; flex-direction: column; gap: 8px; }
.lang-group { display: flex; flex-direction: column; gap: 2px; }
.lang-group > label { font-weight: 600; }
.lang-items { display: flex; flex-direction: column; gap: 1px; padding-left: 18px; }
.langs label { display: flex; align-items: baseline; gap: 5px; font-size: 12.5px; cursor: pointer; }
.langs .cnt { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend .sc-toggle { align-items: flex-start; margin-top: 8px; color: var(--muted); }
.legend .sc-toggle input { margin-top: 3px; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { overflow: auto; }
  .app {
    display: flex; flex-direction: column; gap: 14px; height: auto;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--panel);
  }
  .side { display: contents; }
  .brand { order: 1; }
  .search { order: 2; }
  .stage { order: 3; height: 70svh; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
  .card { order: 4; }
  .pathbox { order: 5; }
  .ov-hint { display: none; }
  .legend { order: 6; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-row">
        <h1 data-i18n="page.h1">Корни нео-эльдарина</h1>
        <div class="head-tools">
          <button class="btn lang" id="theme-toggle" type="button"></button>
          <button class="btn lang" id="lang-toggle" type="button" data-i18n="lang.switch" data-i18n-attr="title:lang.title">English</button>
        </div>
      </div>
      <div class="stat" id="stat"></div>
    </div>

    <div class="search">
      <div class="search-row">
        <input type="search" id="q" placeholder="Слово, корень или значение" autocomplete="off" spellcheck="false" aria-label="Поиск" data-i18n-attr="placeholder:search.placeholder;aria-label:search.label">
        <select id="scope" aria-label="Где искать" data-i18n-attr="aria-label:scope.label">
          <option value="" data-i18n="scope.all">всё</option>
          <option value="nq">ᴺQ.</option>
          <option value="ns">ᴺS.</option>
          <option value="np">ᴺ✶</option>
          <option value="root" data-i18n="scope.roots">корни</option>
        </select>
      </div>
      <div class="results" id="results" hidden></div>
    </div>

    <details class="pathbox" id="path-box">
      <summary data-i18n="path.title">Путь между словами</summary>
      <div class="path-ends">
        <div class="path-end"><input type="search" id="path-a" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:path.from;aria-label:path.from" placeholder="от слова или корня"><div class="results" id="path-a-res" hidden></div></div>
        <button class="btn" id="path-swap" type="button" data-i18n-attr="title:path.swap;aria-label:path.swap" title="поменять местами">⇅</button>
        <div class="path-end"><input type="search" id="path-b" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:path.to;aria-label:path.to" placeholder="до слова или корня"><div class="results" id="path-b-res" hidden></div></div>
      </div>
      <label class="par-mode"><span data-i18n="path.mode">Что искать</span>
        <select id="path-mode">
          <option value="kin" data-i18n="path.mode.kin">родство: ближайший общий источник</option>
          <option value="origin" data-i18n="path.mode.origin">происхождение: одно из другого</option>
          <option value="any" data-i18n="path.mode.any">любая связь</option>
        </select>
      </label>
      <label class="par-mode"><span data-i18n="path.policy">Переходы между концепциями и ветвями</span>
        <select id="path-policy">
          <option value="fewest" data-i18n="path.policy.fewest">как можно меньше (сначала концепции, потом ветви)</option>
          <option value="none" data-i18n="path.policy.none">запрещены: внутри одной концепции и ветви</option>
          <option value="conceptions-not" data-i18n="path.policy.conceptionsNot">только между ветвями</option>
          <option value="branches-not" data-i18n="path.policy.branchesNot">только между концепциями</option>
          <option value="any" data-i18n="path.policy.any">не учитывать: кратчайший путь</option>
        </select>
      </label>
      <label class="sc-toggle"><input type="checkbox" id="path-loose"> <span data-i18n="path.loose">и через нестрогие связи (см., когнат, вместо него, зачёркнутые ссылки)</span></label>
      <div class="path-tools">
        <button class="btn primary" id="path-find" type="button" data-i18n="path.find">Найти</button>
        <button class="btn" id="path-clear" type="button" data-i18n="path.clear">Сбросить</button>
      </div>
      <div id="path-out" aria-live="polite"></div>
    </details>

    <section class="card" id="card" aria-live="polite"></section>

    <section class="legend">
      <div class="sec">
        <h3 data-i18n="legend.nodes">Узлы</h3>
        <div class="legend-grid" id="legend-nodes"></div>
      </div>
      <div class="sec">
        <h3 data-i18n="legend.edges">Связи (от источника к производному)</h3>
        <div class="legend-grid" id="legend-edges"></div>
        <label class="sc-toggle"><input type="checkbox" id="shortcuts"> <span data-i18n="legend.shortcuts">показывать прямые связи корня со словом, если тот же корень ведёт к слову и через промежуточную форму</span></label>
      </div>
      <div class="sec switches">
        <h3 data-i18n="legend.show">Показывать</h3>
        <label class="par-mode"><span data-i18n="vocab.label">Словарь</span>
          <select id="vocab">
            <option value="neo" data-i18n="vocab.neo">нео-эльдарин: неологизмы, замены и ⚠ (как Eldamo с ?neo)</option>
            <option value="tolkien" data-i18n="vocab.tolkien">только Толкин (как Eldamo без ?neo)</option>
          </select>
        </label>
        <label><input type="checkbox" id="show-dep"> <span data-i18n="filter.deprecated">заменённые слова (Eldamo не советует их для нео-эльдарина)</span></label>
        <label><input type="checkbox" id="show-nam"> <span data-i18n="filter.names">имена (места, лица, народы)</span></label>
        <label><input type="checkbox" id="show-oth"> <span data-i18n="filter.other">прочие слова с ⚠️ вне перечней (ранние, отвергнутые, вычеркнутые, без значения)</span></label>
        <label class="par-mode"><span data-i18n="par.label">Формы других концепций</span>
          <select id="par-mode">
            <option value="bands" data-i18n="par.bands">полосами: поздняя, средняя, ранняя</option>
            <option value="stack" data-i18n="par.stack">под своим словом, как на странице Eldamo</option>
            <option value="free" data-i18n="par.free">отдельно, обычными стрелками</option>
          </select>
        </label>
        <label class="par-mode"><span data-i18n="order.label">Порядок в столбце</span>
          <select id="col-order">
            <option value="source" data-i18n="order.source">по источникам, внутри — по ветвям</option>
            <option value="branch" data-i18n="order.branch">по ветвям, внутри — по источникам</option>
            <option value="alpha" data-i18n="order.alpha">по алфавиту</option>
          </select>
        </label>
      </div>
      <div class="sec">
        <h3 data-i18n="legend.langs">Языки</h3>

<script type="application/json" id="graph-data">/*GRAPH*/</script>
<script type="application/json" id="messages-data">/*MESSAGES*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function () {
'use strict';
const G = JSON.parse(document.getElementById('graph-data').textContent);
const N = G.nodes.length;
const SITE = 'https://eldamo.org/content/words/word-';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- interface language
// The catalog (graph_messages.json, embedded by make_graph.py) maps a key to {ru, en};
// placeholders are {name}. Eldamo's data (forms, glosses) are not translated. The choice
// is kept in the browser; without one, the browser's language decides. A switch redraws
// the page in place, so the open graph stays.
const MESSAGES = JSON.parse(document.getElementById('messages-data').textContent);
const LANG_KEY = 'neo-roots-lang';
let uiLang = (() => {
  try { const v = localStorage.getItem(LANG_KEY); if (v === 'ru' || v === 'en') return v; } catch (e) { /* storage unavailable */ }
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ru';
  return /^(ru|uk|be|kk)\b/i.test(nav) ? 'ru' : 'en';
})();
function t(key, params) {
  const e = MESSAGES[key];
  if (!e) { console.warn('i18n: no message', key); return key; }
  const text = e[uiLang] != null ? e[uiLang] : e.ru;
  return params ? text.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? String(params[k]) : m)) : text;
}
const has = key => Object.prototype.hasOwnProperty.call(MESSAGES, key);
function translateStatic() {
  document.documentElement.lang = uiLang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':');
      if (attr && key) el.setAttribute(attr.trim(), t(key.trim()));
    }
  }
}
const num = n => n.toLocaleString(uiLang === 'ru' ? 'ru-RU' : 'en-GB');

// ---------------------------------------------------------------- vocabulary
const LANG = {
  q: ['Q.', 'Quenya'], mq: ['ᴹQ.', 'Middle Quenya'], eq: ['ᴱQ.', 'Early Quenya'], nq: ['ᴺQ.', 'Neo-Quenya'],
  s: ['S.', 'Sindarin'], n: ['N.', 'Noldorin'], en: ['ᴱN.', 'Early Noldorin'], g: ['G.', 'Gnomish'], ns: ['ᴺS.', 'Neo-Sindarin'],
  on: ['ON.', 'Old Noldorin'], os: ['OS.', 'Old Sindarin'], t: ['T.', 'Telerin'], mt: ['ᴹT.', 'Middle Telerin'], et: ['ᴱT.', 'Early Telerin'],
  ilk: ['Ilk.', 'Ilkorin'], eilk: ['ᴱIlk.', 'Early Ilkorin'], dan: ['Dan.', 'Danian'], nan: ['Nan.', 'Nandorin'],
  aq: ['AQ.', 'Ancient Quenya'], maq: ['ᴹAQ.', 'Middle Ancient Quenya'], at: ['AT.', 'Ancient Telerin'], van: ['Van.', 'Vanyarin'],
  norths: ['North S.', 'North Sindarin'], ad: ['Ad.', 'Adûnaic'], av: ['Av.', 'Avarin'], lem: ['Lem.', 'Lemberin'], lin: ['Lin.', 'Lindarin'],
  p: ['✶', 'Primitive Elvish'], mp: ['ᴹ✶', 'Middle Primitive Elvish'], ep: ['ᴱ✶', 'Early Primitive Elvish'], np: ['ᴺ✶', 'Neo-Primitive Elvish'],
};
const ROOT_MARK = { p: '√', mp: 'ᴹ√', ep: 'ᴱ√', np: 'ᴺ√' };
// relation names: [short, long]
const REL = new Proxy({}, { get: (_, r) => [t('rel.' + r), t('rel.' + r + '.long')] });
const langName = code => has('langname.' + code) ? t('langname.' + code) : (LANG[code] ? LANG[code][1] : code);
// a word with several parts of speech ("n adj") shows each
const speech = s => String(s).split(/\s+/).map(x => has('speech.' + x) ? t('speech.' + x) : x).join(' ');

// the colour tokens, read once per theme (recolor() forgets them): the canvas asks for them on every frame
const cssCache = new Map();
const css = name => {
  let v = cssCache.get(name);
  if (v === undefined) { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); cssCache.set(name, v); }
  return v;
};
const relName = k => G.rels[k];
const RELS_INSTEAD = G.rels.indexOf('instead');
const RELS_COMBINE = G.rels.indexOf('combine');

// ---------------------------------------------------------------- the graph
const inE = Array.from({ length: N }, () => []);
const outE = Array.from({ length: N }, () => []);
G.edges.forEach((e, k) => { outE[e[0]].push(k); inE[e[1]].push(k); });
const indexOf = new Map(G.ids.map((x, i) => [x, i]));
const kindOf = i => G.nodes[i].k;
const isRoot = i => kindOf(i) === 'root';
const isListed = n => !!n.grp && !n.x;          // a word of the three lists (not deprecated, not a merged form)

function codeMarker(code, root) {
  return root ? (ROOT_MARK[code] || '√') : (LANG[code] || [code ? code.toUpperCase() + '.' : ''])[0];
}
// the language Eldamo prints in brackets (c:alt-lang): ᴺQ.[ᴱQ.]; the same language twice (ᴹ√[ᴹ√])
// says nothing on the graph, so the bracket shows only another one
const altLang = n => (n.al && n.al !== n.l ? n.al : null);
function marker(i) {
  const n = G.nodes[i], al = altLang(n);
  return codeMarker(n.l, n.k === 'root') + (al ? '[' + codeMarker(al, n.k === 'root') + ']' : '');
}
function shown(i) {           // the NQ list shows its own spelling
  const n = G.nodes[i];
  return n.sp || n.f || '?';
}
function nodeColor(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return css('--n-root');
  if (n.grp) return css('--n-' + n.grp);
  if (n.k === 'protoform') return css('--n-np');
  return css('--n-form');
}

// ---- languages: branch (the hue of a marker) and period (its strength: early faint, neo full)
const BRANCH = {
  quenya: ['nq', 'q', 'mq', 'eq', 'van', 'aq', 'maq'],
  sindarin: ['ns', 's', 'n', 'en', 'g', 'norths', 'os', 'on'],
  primitive: ['np', 'p', 'mp', 'ep'],
  elvish: ['t', 'mt', 'et', 'at', 'nan', 'ilk', 'eilk', 'dan', 'lem', 'lin', 'av'],
};
const BRANCH_TOKEN = { quenya: '--n-nq', sindarin: '--n-ns', primitive: '--n-np', elvish: '--l-elvish', other: '--n-form' };
const branchOf = code => Object.keys(BRANCH).find(b => BRANCH[b].includes(code)) || 'other';
const EARLY = new Set(['eq', 'en', 'g', 'ep', 'et', 'eilk']);
const MIDDLE = new Set(['mq', 'n', 'mp', 'mt', 'ilk', 'dan', 'on', 'maq', 'lem']);
const NEO = new Set(['nq', 'ns', 'np']);
const eraOf = code => (NEO.has(code) ? 3 : EARLY.has(code) ? 0 : MIDDLE.has(code) ? 1 : 2);
// the hue is the branch's; saturation and strength grow from early to neo (on a light page a
// newer language is deeper, on a dark one brighter), so even an early marker keeps its hue
const HUE = { quenya: 190, sindarin: 132, primitive: 266, elvish: 24, other: 215 };
const colorCache = new Map();
function langColor(code, root) {
  const key = code + (root ? '√' : '');
  if (!colorCache.has(key)) {
    const dark = d3.hsl(css('--bg')).l < 0.5, e = eraOf(code), b = branchOf(code);
    const h = root ? 42 : HUE[b];
    const sat = b === 'other' && !root ? 0.15 : [0.42, 0.6, 0.78, 0.92][e];
    const light = dark ? [0.5, 0.6, 0.69, 0.78][e] : [0.58, 0.46, 0.36, 0.28][e];
    colorCache.set(key, d3.hsl(h, sat, light).formatHex());
  }
  return colorCache.get(key);
}
// a marker as html, coloured by language
function markerHtml(i) {
  const n = G.nodes[i], root = n.k === 'root', al = altLang(n);
  return `<span class="mk" style="color:${langColor(n.l, root)}">${esc(codeMarker(n.l, root))}</span>`
    + (al ? `<span class="mk" style="color:${langColor(al, root)}">[${esc(codeMarker(al, root))}]</span>` : '');
}

// ---- what is shown
const relOn = Object.fromEntries(G.rels.map(r => [r, true]));
// a root named directly beside a path through an intermediate form (Q. -(n)dur < √(N)DUR and
// < ✶-ndūr < √(N)DUR): hidden unless switched on, so the path through the form shows
let showShortcuts = false;
let showDeprecated = false;     // Eldamo's deprecated words
let showOther = false;          // other words Eldamo marks ⚠️ and lists nowhere
let showNames = false;          // names (places, persons, peoples)
// forms of other conceptions: 'bands' -- one column with their word, the conceptions in horizontal
// bands (late with neo, middle, early); 'stack' -- under their word, as on Eldamo's page; 'free'
let parMode = 'bands';
// the order of a column: 'source' -- by where the sources stand, the derivatives of one source by
// branch; 'branch' -- by branch (Quenya on top, then Sindarin...), within it by sources; 'alpha'
let colOrder = (() => { try { const v = localStorage.getItem('neo-roots-order'); return ['source', 'branch', 'alpha'].includes(v) ? v : 'source'; } catch (e) { return 'source'; } })();
const langOn = {};              // a language switched off in the legend: false
const isShortcut = e => !!(e[3] && e[3].sc);
const edgeOn = k => relOn[relName(G.edges[k][2])] && (showShortcuts || !isShortcut(G.edges[k]))
  && !(tolkien() && (G.edges[k][2] === RELS_INSTEAD || G.edges[k][2] === RELS_COMBINE));
// links of origin, and the links of one word across conceptions (a word and the forms merged into
// it, a root and the roots merged into or filed under it)
const ORIGIN = new Set(['deriv', 'element', 'combine', 'see', 'deprecated', 'cognate']);
const PARALLEL = new Set(['combine', 'merged', 'filed']);
// the vocabulary: 'neo' -- Neo-Eldarin, as Eldamo's pages with ?neo (neologisms, deprecations and
// replacements, ⚠); 'tolkien' -- Tolkien's words only, as Eldamo's pages without it: no ᴺQ., ᴺS., ᴺ✶,
// ᴺ√, and the words Eldamo deprecates for Neo-Eldarin are ordinary words of their languages. So are the
// words merged (<combine>) into another for Neo-Eldarin: with ?neo Eldamo sends their pages on to that word
// (ᴱQ. aiko to ᴺQ.[ᴱQ.] aico), without it each is a word of its own language, and the merge is not shown
let vocab = (() => { try { return localStorage.getItem('neo-roots-vocab') === 'tolkien' ? 'tolkien' : 'neo'; } catch (e) { return 'neo'; } })();
const tolkien = () => vocab === 'tolkien';
// whether a word of its kind is shown (the switches of the legend and the vocabulary)
function kindShown(n) {
  if (tolkien() && NEO.has(n.l)) return false;
  if (n.x === 'd') return tolkien() || showDeprecated;
  if (n.x === 'o') return tolkien() || showOther || !!n.iv;
  if (n.x === 'n') return showNames || !!n.iv;
  return true;
}
const passes = i => {
  const n = G.nodes[i];
  return langOn[n.l] !== false && kindShown(n);
};

// ---------------------------------------------------------------- state
const visible = new Set();
let focusNode = -1, selected = -1;
// what keeps each node on the graph: 'core' (the focus and its tree) or the nodes whose expansion
// added it; collapsing a node removes what only it keeps
const owners = new Map();
const expanded = new Set();
function own(x, by) { if (!owners.has(x)) owners.set(x, new Set()); owners.get(x).add(by); }
const pos = new Map();          // node -> {x, y, vx, vy, fx, fy}; a dragged node keeps fx, fy

// links not shown yet, by side: to the sources (what the node comes from: its earlier forms, its
// elements, the forms merged into it, its cognates, the root it is filed under) and to the derivatives
const RELS_COGNATES = G.rels.indexOf('cognates');
const isCognates = k => G.edges[k][2] === RELS_COGNATES;
function hiddenIn(i) {
  let h = 0;
  for (const k of inE[i]) if (!isCognates(k) && edgeOn(k) && !visible.has(G.edges[k][0]) && passes(G.edges[k][0])) h++;
  return h;
}
function hiddenOut(i) {
  let h = 0;
  for (const k of outE[i]) if (!isCognates(k) && edgeOn(k) && !visible.has(G.edges[k][1]) && passes(G.edges[k][1])) h++;
  return h;
}

function upstream(i, cap) {
  const out = [i], seen = new Set([i]);
  for (let q = 0; q < out.length && out.length < cap; q++) {
    if (q > 0 && isRoot(out[q])) continue;      // a root's own merges and filing open on expand
    for (const k of inE[out[q]]) {
      if (!edgeOn(k) || relName(G.edges[k][2]) === 'instead' || isCognates(k)) continue;   // a replacement, a cognate: not origins
      const a = G.edges[k][0];
      if (!seen.has(a)) { seen.add(a); out.push(a); }
    }
  }
  return out;
}
function downstream(i, depth, cap) {
  let layer = [i];
  const out = [], seen = new Set([i]);
  for (let d = 0; d < depth && layer.length; d++) {
    const next = [];
    for (const x of layer) {
      for (const k of outE[x]) {
        if (!edgeOn(k) || isCognates(k)) continue;
        const b = G.edges[k][1];
        if (seen.has(b) || !passes(b)) continue;
        if (out.length >= cap) return out;
        seen.add(b); out.push(b); next.push(b);
      }
    }
    layer = next;
  }
  return out;
}

function focus(i, keep) {
  if (i < 0) return;
  unknownMsg = '';
  if (!keep) { visible.clear(); pos.clear(); owners.clear(); expanded.clear(); }
  setMode('graph');
  focusNode = i;
  for (const x of upstream(i, 300)) { visible.add(x); own(x, 'core'); }
  const down = isRoot(i) ? downstream(i, 2, 160) : downstream(i, 1, 40);
  for (const x of down) { visible.add(x); own(x, 'core'); }
  // and its cognates (the Cognates section of its page), of whatever kind (S. Edhelharn ~ Q. Elessar,
  // both names); the languages switched off in the legend still apply
  cognateKeep.clear();
  for (const k of [...inE[i], ...outE[i]]) {
    if (!isCognates(k) || !edgeOn(k)) continue;
    const x = G.edges[k][0] === i ? G.edges[k][1] : G.edges[k][0];
    visible.add(x); own(x, 'core'); cognateKeep.add(x);
  }
  select(i);
  try { history.replaceState(null, '', '#n-' + G.ids[i]); } catch (e) { /* the frame may refuse */ }
  render(true);
}
// dir: 'all', 'in' (the sources only) or 'out' (the derivatives only)
function expand(i, dir = 'all') {
  const around = [];
  if (dir !== 'out') for (const k of inE[i]) if (edgeOn(k) && (dir === 'all' || !isCognates(k))) around.push(G.edges[k][0]);
  let added = 0;
  for (const k of dir === 'in' ? [] : outE[i]) {
    if (!edgeOn(k) || (dir !== 'all' && isCognates(k))) continue;
    if (added >= 80) break;
    const b = G.edges[k][1];
    if (!visible.has(b) && passes(b)) added++;
    around.push(b);
  }
  const p = pos.get(i);
  expanded.add(i);
  for (const x of around) {
    if (x === i) continue;
    if (!visible.has(x) && p && !pos.has(x)) pos.set(x, { x: p.x + (Math.random() - .5) * 40, y: p.y + (Math.random() - .5) * 40 });
    visible.add(x);
    own(x, i);
  }
  render(false);
}
function drop(i) {
  for (const s of owners.values()) s.delete(i);
  visible.delete(i); pos.delete(i); owners.delete(i);
}
// undo an expansion: the nodes only it keeps go, and what they expanded with them
function collapseFrom(i) {
  expanded.delete(i);
  for (const [x, by] of [...owners]) {
    if (!by.has(i)) continue;
    by.delete(i);
    if (by.size || x === focusNode) continue;
    if (expanded.has(x)) collapseFrom(x);
    drop(x);
  }
}
function collapse(i) {
  collapseFrom(i);
  if (!visible.has(selected)) select(visible.has(i) ? i : focusNode);
  render(false);
}
function toggle(i) {
  if (expanded.has(i)) collapse(i); else expand(i);
}
// one side: opens what is hidden there; with nothing hidden there, collapses what the node expanded
function toggleSide(i, dir) {
  if ((dir === 'in' ? hiddenIn(i) : hiddenOut(i)) > 0) expand(i, dir);
  else if (expanded.has(i)) collapse(i);
}
function removeNode(i) {
  if (i === focusNode) return;
  if (expanded.has(i)) collapseFrom(i);
  drop(i);
  if (selected === i || !visible.has(selected)) select(focusNode);
  render(false);
}

// ---------------------------------------------------------------- layout and drawing
// The graph is drawn on a canvas under the svg, which (empty in this view) takes the pointer: the zoom
// and pan, the picking of nodes and links by their geometry. With hundreds of nodes an svg laid out
// every label anew on each step of a zoom or a layout; a canvas only paints
const svg = d3.select('#graph');
const grCanvas = $('gr-canvas');
let mode = 'graph';
// a node is dragged with what hangs on it alone (its derivatives without another parent on the graph);
// with Shift alone. What is moved stays where it is put; "Re-layout" frees it. The drag begins with the
// first move: a click alone neither wakes the layout nor pins the node. Set before the zoom, so that a
// press on a node is the node's and not a pan
svg.call(d3.drag()
  .filter(ev => mode === 'graph' && !ev.ctrlKey && !ev.button)
  .subject(ev => {
    const tr = d3.zoomTransform(svg.node());
    const d = nodeAt(...tr.invert([ev.x, ev.y]), tr.k);
    // d3.drag keeps the grip as subject minus pointer, both in the svg's own (screen) units
    return d ? { d, x: tr.applyX(d.x), y: tr.applyY(d.y) } : null;
  })
  .on('start', ev => {
    const s = ev.subject;
    s.x0 = ev.x; s.y0 = ev.y; s.shift = !!(ev.sourceEvent && ev.sourceEvent.shiftKey);
  })
  .on('drag', ev => {
    const s = ev.subject, d = s.d;
    if (!s.moved) {
      if (ev.x === s.x0 && ev.y === s.y0) return;
      s.moved = true;
      hideTip();
      if (sim) { settled = false; sim.alphaTarget(0.1).restart(); }
      s.group = s.shift ? [d] : dependents(d);
      for (const m of s.group) { m._dx = m.x - d.x; m._dy = m.y - d.y; m.fx = m.x; m.fy = m.y; }
    }
    const [gx, gy] = d3.zoomTransform(svg.node()).invert([ev.x, ev.y]);
    for (const m of s.group) { m.fx = gx + m._dx; m.fy = clampY(m, gy + m._dy); }
  })
  .on('end', ev => { if (ev.subject.moved && sim) sim.alphaTarget(0); grRequestDraw(); }));
const zoom = d3.zoom().scaleExtent([0.08, 40]).on('zoom', () => {
  if (mode === 'graph') grRequestDraw();
  else ovRequestDraw();
});
svg.call(zoom).on('dblclick.zoom', null);

const DASH = { deriv: null, element: null, combine: '2 3', see: '1 3', deprecated: '6 4', cognate: '6 3 1 3', cognates: '5 2 1 2', merged: '1 3', filed: '4 3', rootderiv: null, instead: '3 3' };

let COL = 230;
const STACK = 36;              // the step between a word and the forms under it
const BOX_H = 30;              // the height of a node with its label above
let sim = null;
let shownNodes = new Set();

// the links among the shown nodes; a path through hidden nodes (a language switched off, a
// deprecated word) becomes one link "through hidden nodes" with the relation of its last step
function shownLinks(shownSet) {
  const edges = [], real = new Set(), virtual = new Map();
  for (const a of shownSet) {
    for (const k of outE[a]) {
      if (!edgeOn(k)) continue;
      const e = G.edges[k], b = e[1], rel = relName(e[2]);

$('legend-langs').addEventListener('change', ev => {
  const c = ev.target;
  if (c.dataset.lang) langOn[c.dataset.lang] = c.checked;
  if (c.dataset.branch) for (const code of LANG_COUNT.keys()) if (branchOf(code) === c.dataset.branch) langOn[code] = c.checked;
  legendLangs();
  refilter();
});
// a kind of words switched on also joins the focus's own neighbourhood (its tree and derivatives), as if
// it had been on when the node was opened; switched off, it just goes
function switchKind(on) {
  if (on && focusNode >= 0 && mode === 'graph') {
    const sel = selected;
    focus(focusNode, true);
    if (sel >= 0 && visible.has(sel)) select(sel);
    if (ovBuilt) buildOverview();
    if (!$('results').hidden) search();
  } else refilter();
}
$('show-dep').addEventListener('change', ev => { showDeprecated = ev.target.checked; switchKind(showDeprecated); });
function applyVocab() {
  $('vocab').value = vocab;
  // in Tolkien's vocabulary deprecated and other ⚠ words are ordinary words: their switches do not apply
  for (const id of ['show-dep', 'show-oth']) $(id).disabled = tolkien();
}
$('vocab').addEventListener('change', ev => {
  vocab = ev.target.value === 'tolkien' ? 'tolkien' : 'neo';
  try { localStorage.setItem('neo-roots-vocab', vocab); } catch (e) { /* storage unavailable */ }
  applyVocab();
  switchKind(true);          // either way some words appear: neologisms, or the deprecated as ordinary words
});
applyVocab();
$('show-oth').addEventListener('change', ev => { showOther = ev.target.checked; switchKind(showOther); });
$('show-nam').addEventListener('change', ev => { showNames = ev.target.checked; switchKind(showNames); });
$('col-order').value = colOrder;
$('col-order').addEventListener('change', ev => {
  colOrder = ev.target.value;
  try { localStorage.setItem('neo-roots-order', colOrder); } catch (e) { /* storage unavailable */ }
  for (const i of visible) pos.delete(i);
  render(true);
  if (selected >= 0) select(selected);
});
$('par-mode').addEventListener('change', ev => {
  parMode = ev.target.value;
  for (const i of visible) pos.delete(i);          // a new arrangement, laid out afresh
  render(true);
  if (selected >= 0) select(selected);
});

$('legend-edges').addEventListener('change', ev => {
  const c = ev.target.closest('[data-rel]');
  if (!c) return;
  relOn[c.dataset.rel] = c.checked;
  render(false);
  if (selected >= 0) select(selected);
});

$('shortcuts').addEventListener('change', ev => {
  showShortcuts = ev.target.checked;
  if (showShortcuts && focusNode >= 0) for (const x of upstream(focusNode, 300)) { visible.add(x); own(x, 'core'); }
  render(false);
  if (selected >= 0) select(selected);
});

// theme changes recolor the drawing
function recolor() {
  cssCache.clear();
  colorCache.clear();
  legend(); legendLangs();
  grRequestDraw();
  if (visible.size) render(false); if (selected >= 0) select(selected); if (ovBuilt) buildOverview();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------------------------------------------------------- start
const words = G.nodes.filter(isListed).length;
const depWords = G.nodes.filter(n => n.x === 'd').length;
const otherWords = G.nodes.filter(n => n.x === 'o').length;
const nameWords = G.nodes.filter(n => n.x === 'n').length;
const rootsCount = G.nodes.filter(n => n.k === 'root').length;
function showStat() {
  $('stat').textContent = t('page.stat', { v: G.version, words: num(words), dep: num(depWords), oth: num(otherWords), nam: num(nameWords), roots: num(rootsCount), edges: num(G.edges.length) });
}
function applyLanguage() {
  translateStatic();
  applyTheme();
  showStat();
  showNote();
  legend();
  legendLangs();
  if (selected >= 0) select(selected);
  if (!$('results').hidden) search();
  if (visible.size) render(false);
  if (ovBuilt) buildOverview();
}
// the theme: the system's (or the host's) by default, or chosen here: auto -> light -> dark;
// the choice is kept in this browser and set as data-theme, which the colour tokens follow
const THEME_KEY = 'neo-roots-theme';
let themeChoice = (() => { try { const v = localStorage.getItem(THEME_KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; } })();
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyTheme() {
  if (themeChoice === 'auto') {
    if (hostTheme) document.documentElement.setAttribute('data-theme', hostTheme);
    else document.documentElement.removeAttribute('data-theme');
  } else document.documentElement.setAttribute('data-theme', themeChoice);
  $('theme-toggle').textContent = { auto: '◐', light: '☀', dark: '☾' }[themeChoice];
  $('theme-toggle').title = t('theme.' + themeChoice) + ' — ' + t('theme.title');
  $('theme-toggle').setAttribute('aria-label', $('theme-toggle').title);
}
$('theme-toggle').addEventListener('click', () => {
  themeChoice = { auto: 'light', light: 'dark', dark: 'auto' }[themeChoice];
  try { localStorage.setItem(THEME_KEY, themeChoice); } catch (e) { /* storage unavailable */ }
  applyTheme();
});
$('lang-toggle').addEventListener('click', () => {
  uiLang = uiLang === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem(LANG_KEY, uiLang); } catch (e) { /* storage unavailable */ }
  applyLanguage();
});
translateStatic();
applyTheme();
showStat();
legend();
legendLangs();
function fromHash() {
  const m = /^#n-(\w+)$/.exec(location.hash);
  return m && indexOf.has(m[1]) ? indexOf.get(m[1]) : -1;
}
window.addEventListener('hashchange', () => {
  if (location.hash === '#all-roots') { setMode('roots'); return; }
  if (location.hash.startsWith('#path-')) { pathFromHash(location.hash); return; }
  const i = fromHash(); if (i >= 0 && i !== focusNode) focus(i);
  else if (i < 0) {
    const h = location.hash;
    try { history.replaceState(null, '', '#n-' + G.ids[focusNode]); } catch (e) { /* the frame may refuse */ }
    unknownNode(h);
  }
});
// an address with a page that is not on the graph (a name, a phrase...): said so, not passed over
function unknownNode(hash = location.hash) {
  const m = /^#n-(\w+)$/.exec(hash);
  if (m && !indexOf.has(m[1])) { unknownMsg = t('note.unknown', { id: m[1] }); showNote(); }
}
const wantRoots = location.hash === '#all-roots';
const startHash = location.hash;          // focus() rewrites the address
const start = fromHash();
const startPath = startHash.startsWith('#path-');
const pathStart = startPath ? /^#path-(\w+)-/.exec(startHash) : null;
focus(start >= 0 ? start : pathStart && indexOf.has(pathStart[1]) ? indexOf.get(pathStart[1])
  : indexOf.get('3583944535'));     // Q. Elda
if (wantRoots) setMode('roots');
if (startPath) pathFromHash(startHash);
else if (start < 0) unknownNode(startHash);
})();
</script>
